930.0" y="710.0" font-size="15" fill="#b94334" text-anchor="start" font-weight="600" aria-label="Supraspinatus in the supraspinous fossa — 冈上肌（冈上窝内）"><tspan x="930.0" dy="0" lang="en">Supraspinatus in the supraspinous fossa</tspan><tspan x="930.0" dy="19" lang="zh-CN" font-size="13" font-weight="400" fill="#68726a">冈上肌（冈上窝内）</tspan></text><path d="M240.0,645.0 L922.0,785.0" fill="none" stroke="#5c7a3a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="930.0" y="790.0" font-size="15" fill="#5c7a3a" text-anchor="start" font-weight="600" aria-label="Rhomboid major — 大菱形肌"><tspan x="930.0" dy="0" lang="en">Rhomboid major</tspan><tspan x="930.0" dy="19" lang="zh-CN" font-size="13" font-weight="400" fill="#68726a">大菱形肌</tspan></text><text x="700.0" y="900.0" font-size="13" fill="#6b706a" text-anchor="middle" font-weight="400" aria-label="Schematic. The base art places the scapula a little low; on a real back the superior angle is near T2, about 1 cun from SI14. — 示意图。底图的肩胛骨略偏低；真人身上肩胛骨上角约平 T2，与肩外俞相距约 1 寸。"><tspan x="700.0" dy="0" lang="en">Schematic. The base art places the scapula a little low; on a real back the superior angle is near T2, about 1 cun from SI14.</tspan><tspan x="700.0" dy="17" lang="zh-CN" font-size="11" font-weight="400" fill="#68726a">示意图。底图的肩胛骨略偏低；真人身上肩胛骨上角约平 T2，与肩外俞相距约 1 寸。</tspan></text><text class="fig-foot" x="38" y="946" font-size="13" fill="#6b706a"><tspan x="38" dy="0" lang="en">Schematic; pathway and layers are simplified.</tspan><tspan x="38" dy="17" lang="zh-CN">解剖示意；走行与层次经过简化。</tspan></text></svg>