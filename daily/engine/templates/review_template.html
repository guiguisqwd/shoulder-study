<title>经穴肌肉记忆卡</title>
<style>
/* 布局：单栏学习台。顶部是进度，中间是今天要过的卡片，下面按经络、部位浏览全部卡片。 */
:root{
  --bg:#f6f3ea; --paper:#fffdf7; --ink:#262a27; --muted:#68706a; --rule:#ddd8ca;
  --accent:#3f6a5c; --accent-ink:#ffffff; --soft:#e9eee5; --warn:#a8473a; --warn-soft:#f6e6e1;
  --font-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-display:"Songti SC","STSong","Noto Serif SC",Georgia,serif;
  --font-num:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171b19; --paper:#20251f; --ink:#e7e6df; --muted:#a3aba3; --rule:#343b35;
  --accent:#8cc0aa; --accent-ink:#10201a; --soft:#25302a; --warn:#e3907f; --warn-soft:#3a2622; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171b19; --paper:#20251f; --ink:#e7e6df; --muted:#a3aba3; --rule:#343b35;
  --accent:#8cc0aa; --accent-ink:#10201a; --soft:#25302a; --warn:#e3907f; --warn-soft:#3a2622; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.75 var(--font-body);margin:0}
.wrap{max-width:860px;margin:0 auto;padding-inline:18px;padding-block:22px 60px}
h1{font:600 30px/1.3 var(--font-display);margin:4px 0 6px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 18px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 22px}
.stat{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;min-width:0}
.stat b{display:block;font:600 22px/1.2 var(--font-num);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.bar{height:5px;background:var(--rule);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.tabs button{border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 14px;font:500 14px var(--font-body);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tabs button:focus-visible,.btn:focus-visible,summary:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.search{width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--paper);color:var(--ink);font:15px var(--font-body);margin:0 0 14px}
.study{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:22px 22px 18px}
.study .meta{font-size:12px;color:var(--muted);letter-spacing:.4px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.study h2{font:600 34px/1.25 var(--font-display);margin:10px 0 2px}
.study .sub{color:var(--muted);margin:0 0 10px}
.study .ask{background:var(--soft);border-radius:8px;padding:9px 12px;font-size:14px;margin:6px 0 12px}
dl.fields{display:grid;grid-template-columns:118px minmax(0,1fr);gap:8px 14px;margin:0;font-size:14.5px}
dl.fields dt{color:var(--muted);font-size:12.5px;padding-top:2px}
dl.fields dd{margin:0;min-width:0;overflow-wrap:anywhere}
dd.safe{color:var(--warn)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:9px;padding:10px 16px;font:600 14px var(--font-body);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.again{color:var(--warn);border-color:var(--warn)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.group{margin:0 0 14px}
.group>summary{cursor:pointer;font-weight:600;padding:8px 2px;list-style:none;display:flex;justify-content:space-between;gap:10px}
.group>summary::-webkit-details-marker{display:none}
.group>summary span{color:var(--muted);font-weight:400;font-size:13px;font-family:var(--font-num)}
.rows{display:grid;gap:8px}
.row{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:10px 14px}
.row>summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.row>summary::-webkit-details-marker{display:none}
.row b{font:600 18px var(--font-display)}
.row small{color:var(--muted)}
.pill{margin-left:auto;font-size:11.5px;border-radius:999px;padding:1px 9px;background:var(--soft);color:var(--accent);white-space:nowrap}
.pill.due{background:var(--warn-soft);color:var(--warn)}
.row dl{margin-top:10px}
.foot{font-size:12px;color:var(--muted);margin-top:30px;border-top:1px solid var(--rule);padding-top:12px}
.sync{font-size:12.5px;color:var(--muted);margin:14px 0 0}
.sync.warn{color:var(--warn)}
@media(max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}dl.fields{grid-template-columns:1fr}dl.fields dt{padding-top:6px}.study h2{font-size:28px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="wrap">
  <p class="lede" id="today-line">DPT 基础 · 12 月 23 日前背完</p>
  <h1>经穴与肌肉记忆卡</h1>
  <div class="stats">
    <div class="stat"><b id="s-acu">0</b><span>已学穴位 / 362</span><div class="bar"><i id="b-acu"></i></div></div>
    <div class="stat"><b id="s-mus">0</b><span>已学肌肉 / 157</span><div class="bar"><i id="b-mus"></i></div></div>
    <div class="stat"><b id="s-due">0</b><span>今天要复习</span></div>
    <div class="stat"><b id="s-left">0</b><span>距 12 月 23 日（天）</span></div>
  </div>
  <div class="tabs" role="group" aria-label="视图">
    <button type="button" data-view="due" aria-pressed="true">今天复习</button>
    <button type="button" data-view="meridian" aria-pressed="false">按经络</button>
    <button type="button" data-view="region" aria-pressed="false">按部位</button>
    <button type="button" data-view="all" aria-pressed="false">按学习日期</button>
  </div>
  <input class="search" id="q" type="search" placeholder="搜索穴名或肌肉名（中文或英文）" aria-label="搜索">
  <div id="view"></div>
  <p class="sync" id="sync" role="status" hidden></p>
  <p class="foot">复习间隔：学完后第 1、3、7、14、30 天，之后每 60 天一次。点“记住了”进入下一档；点“没记住”明天再来。每次作答都记进复习中心的共享记录，换设备也能接着复习；连不上时先存在本机，下次打开自动补上。定位依据 GB/T 12346；层次为学习用的简化描述，不代表进针方向或深度。</p>
</div>
<script type="application/json" id="cards">__CARDS__</script>
<script>
(function(){
var CARDS=JSON.parse(document.getElementById('cards').textContent);
var INT=[1,3,7,14,30,60], KEY='dpt-cards-v1', DEADLINE='2026-12-23';
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(s,n){var p=s.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+n);return iso(d);}
var TODAY=iso(new Date());
var state={};try{state=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){state={};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function st(c){return state[c.id]||{step:0,next:addDays(c.learned,1)};}
function isDue(c){return c.learned<=TODAY && st(c).next<=TODAY;}
function esc(s){return String(s).replace(/[&<>"]/g,function(ch){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch];});}
function fields(c){return '<dl class="fields">'+c.fields.filter(function(f){return f[1];}).map(function(f){return '<dt>'+esc(f[0])+'</dt><dd'+(f[0]==='安全提示'&&f[1]!=='—'?' class="safe"':'')+'>'+esc(f[1])+'</dd>';}).join('')+'</dl>';}
var learned=CARDS.filter(function(c){return c.learned<=TODAY;});
function stats(){
  var a=learned.filter(function(c){return c.type==='acu';}).length, m=learned.filter(function(c){return c.type==='mus';}).length;
  document.getElementById('s-acu').textContent=a;document.getElementById('b-acu').style.width=Math.min(100,a/362*100)+'%';
  document.getElementById('s-mus').textContent=m;document.getElementById('b-mus').style.width=Math.min(100,m/157*100)+'%';
  document.getElementById('s-due').textContent=learned.filter(isDue).length;
  var p=DEADLINE.split('-'),t=TODAY.split('-');var left=Math.round((new Date(+p[0],+p[1]-1,+p[2])-new Date(+t[0],+t[1]-1,+t[2]))/864e5);
  document.getElementById('s-left').textContent=Math.max(0,left);
  document.getElementById('today-line').textContent='DPT 基础 · 今天 '+TODAY+' · 12 月 23 日前背完十四经穴和常用肌肉';}
var view='due', q='', shown=false, queue=null;
function match(c){if(!q)return true;var s=(c.title+' '+c.sub+' '+c.meridian+' '+c.region).toLowerCase();return s.indexOf(q)>=0;}
function renderDue(){
  if(!queue)queue=learned.filter(isDue).filter(match).map(function(c){return c.id;});
  var el=document.getElementById('view');
  if(!queue.length){el.innerHTML='<div class="study empty"><p><b>今天的复习完成了。</b></p><p>可以切到“按经络”或“按部位”，把还不熟的再过一遍。</p></div>';return;}
  var c=CARDS.filter(function(x){return x.id===queue[0];})[0], s=st(c);
  el.innerHTML='<div class="study" aria-live="polite"><div class="meta"><span>'+(c.type==='acu'?'穴位 · '+esc(c.meridian):'肌肉 · '+esc(c.region))+'</span><span>还剩 '+queue.length+' 张 · 第 '+(s.step+1)+' 档</span></div>'+
   '<h2>'+esc(c.title)+'</h2>'+(c.type==='mus'&&shown?'<p class="sub">'+esc(c.sub)+'</p>':'<p class="sub">&nbsp;</p>')+
   '<div class="ask">先说出来：'+esc(c.ask)+'</div>'+(shown?fields(c):'')+
   '<div class="actions">'+(shown?'<button class="btn again" data-act="again" type="button">没记住</button><button class="btn primary" data-act="know" type="button">记住了</button>':'<button class="btn primary" data-act="show" type="button">显示答案</button>')+'</div></div>';}
function group(key){
  var el=document.getElementById('view'), groups={}, order=[];
  learned.filter(match).forEach(function(c){var k=key==='all'?c.learned:(key==='meridian'?(c.type==='acu'?c.meridian:'肌肉'):c.region);if(!groups[k]){groups[k]=[];order.push(k);}groups[k].push(c);});
  if(key==='all')order.sort().reverse();
  if(!order.length){el.innerHTML='<div class="study empty">没有找到匹配的卡片。</div>';return;}
  el.innerHTML=order.map(function(k){var due=groups[k].filter(isDue).length;
    return '<details class="group" open><summary>'+esc(k)+'<span>'+groups[k].length+' 张'+(due?' · '+due+' 张待复习':'')+'</span></summary><div class="rows">'+
    groups[k].map(function(c){var s=st(c);return '<details class="row"><summary><b>'+esc(c.title)+'</b><small>'+esc(c.type==='acu'?c.meridian:c.sub)+'</small><span class="pill'+(isDue(c)?' due':'')+'">'+(isDue(c)?'今天复习':'下次 '+s.next.slice(5))+'</span></summary>'+fields(c)+'</details>';}).join('')+'</div></details>';}).join('');}
function render(){stats();if(view==='due')renderDue();else group(view);}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-view]');if(t){view=t.dataset.view;document.querySelectorAll('[data-view]').forEach(function(b){b.setAttribute('aria-pressed',b===t?'true':'false');});queue=null;shown=false;render();return;}
  var a=e.target.closest('[data-act]');if(!a)return;var id=queue&&queue[0];if(!id)return;var c=CARDS.filter(function(x){return x.id===id;})[0];
  if(a.dataset.act==='show'){shown=true;render();return;}
  TODAY=iso(new Date());   // the page may stay open past midnight
  var s=st(c), n;
  if(a.dataset.act==='know'){var step=Math.min(s.step+1,INT.length-1);n={step:step,next:addDays(TODAY,INT[step])};queue.shift();}
  else{n={step:0,next:addDays(TODAY,1)};queue.push(queue.shift());}
  state[id]=n;record(c,a.dataset.act,s,n);save();shown=false;render();});
document.getElementById('q').addEventListener('input',function(e){q=e.target.value.trim().toLowerCase();queue=null;shown=false;render();});
/* 作答记录。每次点“记住了”“没记住”记一条，写进复习中心的共享数据库：
   answers/<id>  一次打开页面的作答（events，每份最多 MAXEV 条），push-hub 每天同步进 feedback/；
   progress/c<卡片 id 的 UTF-8 十六进制>  每张卡的档位和下次日期，换设备时取较新的一份。
   数据库用不了时先存在本机（PKEY；本机也存不了时只在内存里），下次打开再补写。 */
var PKEY='dpt-cards-sync-v1', DEVKEY='dpt-cards-device', MAXEV=400;
var LS=(function(){try{localStorage.setItem('dpt-cards-t','1');localStorage.removeItem('dpt-cards-t');return true;}catch(e){return false;}})();
function load(k,d){try{var v=JSON.parse(localStorage.getItem(k)||'null');return v==null?d:v;}catch(e){return d;}}
function put(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function rid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
var MEM={events:[],progress:{}};
function pend(){if(!LS)return MEM;var p=load(PKEY,null);if(!p||typeof p!=='object')p={};if(!Array.isArray(p.events))p.events=[];if(!p.progress||typeof p.progress!=='object')p.progress={};return p;}
function keep(p){if(LS)put(PKEY,p);else MEM=p;}
var DEVICE=load(DEVKEY,'');if(!DEVICE){DEVICE='d'+rid();put(DEVKEY,DEVICE);}
var backlog=pend().events.slice(), SESSION='s'+rid(), sess=[], db=null, ready=false, busy=false, more=false;
var problem='', pullProblem='', pulled=false, answered=0;
function hex(s){var u=unescape(encodeURIComponent(s)),o='';for(var i=0;i<u.length;i++)o+=('0'+u.charCodeAt(i).toString(16)).slice(-2);return o;}
function record(c,act,before,after){
  var now=new Date().toISOString();after.at=now;answered++;
  var ev={id:'e'+rid(),card:c.id,title:c.title,kind:c.type,result:act,step_before:before.step,step_after:after.step,next:after.next,learned:c.learned,day:TODAY,at:now};
  var p=pend();p.events.push(ev);p.progress[c.id]=after;keep(p);sess.push(ev);flush();}
function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}
async function retry(fn){try{return await fn();}catch(e){if(!e||e.code!=='unavailable')throw e;await wait(800+Math.random()*1200);return await fn();}}
function write(ref,data){return retry(function(){return ref.set(data);});}
function idsOf(evs){var o={};evs.forEach(function(e){o[e.id]=1;});return o;}
function dropEvents(ids){var p=pend();p.events=p.events.filter(function(e){return !ids[e.id];});keep(p);}
function docOf(id,evs){return {schema:'dpt-answers/1',session:id,device:DEVICE,day:evs[0].day,updated:new Date().toISOString(),count:evs.length,events:evs};}
async function flush(){
  if(!db){showSync();return;}
  if(busy){more=true;return;}
  busy=true;problem='';
  do{more=false;
    try{
      while(backlog.length){var chunk=backlog.slice(0,MAXEV), cid='s'+rid();   // answers left from earlier visits
        await write(db.doc('answers/'+cid),docOf(cid,chunk));dropEvents(idsOf(chunk));backlog=backlog.slice(chunk.length);}
      if(sess.length){var evs=sess.slice();
        await write(db.doc('answers/'+SESSION),docOf(SESSION,evs));dropEvents(idsOf(evs));
        if(sess.length>=MAXEV&&sess.length===evs.length){SESSION='s'+rid();sess=[];}}
    }catch(e){problem=(e&&e.code)||'unavailable';}
    try{
      if(!pulled)await pull();
      if(pulled){var todo=pend().progress;   // only after reading the other devices' progress
        for(var id in todo){var v=todo[id];
          await write(db.doc('progress/c'+hex(id)),{card:id,step:v.step,next:v.next,at:v.at||''});
          var q=pend();if(q.progress[id]&&q.progress[id].at===v.at){delete q.progress[id];keep(q);}}}
    }catch(e){problem=problem||(e&&e.code)||'unavailable';}
  }while(more&&!problem);
  busy=false;showSync();}
function showSync(){
  var el=document.getElementById('sync'), p=pend(), n=p.events.length||Object.keys(p.progress).length, msg='', ok=false;
  if(!ready){el.hidden=true;return;}
  if(!db&&!LS)msg='这个页面现在连不上共享记录，这个浏览器也不能在本机存数据，这次的作答不会被记录。';
  else if(problem==='quota_exceeded')msg='共享记录已经存满，新的作答先存在本机（'+n+' 条）。请告诉 Claude 清理。';
  else if(problem)msg='有 '+n+' 条作答还没写进共享记录，已先存在本机；下次作答或重新打开页面时再试。';
  else if(!db&&n)msg='这个页面现在连不上共享记录，'+n+' 条作答先存在本机，下次打开自动补上。';
  else if(!db)msg='这个页面现在连不上共享记录，作答先存在本机。';
  else if(pullProblem)msg='没能读取其他设备的复习进度，这里的到期卡片可能不是最新的；作答照常记录。';
  else if(n){msg='正在保存作答…';ok=true;}
  else if(answered){msg='作答已记录。';ok=true;}
  if(msg&&!LS&&db&&n)msg+=' 这个浏览器不能在本机存数据，关掉页面前没写进共享记录的作答会丢。';
  el.textContent=msg;el.hidden=!msg;el.className='sync'+(ok?'':' warn');}
function okStep(v){return v&&typeof v.card==='string'&&v.step===(v.step|0)&&v.step>=0&&v.step<INT.length&&/^\d{4}-\d{2}-\d{2}$/.test(v.next);}
async function pull(){
  var snap;
  try{snap=await retry(function(){return db.collection('progress').limit(1000).get();});}
  catch(e){pullProblem=(e&&e.code)||'unavailable';return;}
  pulled=true;pullProblem='';
  var remote={}, changed=false, p=pend();
  snap.docs.forEach(function(doc){var v=doc.data();if(!okStep(v))return;remote[v.card]=v;var l=state[v.card];
    if(!l||String(v.at||'')>String(l.at||'')){state[v.card]={step:v.step,next:v.next,at:String(v.at||'')};changed=true;
      if(p.progress[v.card]&&String(p.progress[v.card].at||'')<=String(v.at||''))delete p.progress[v.card];}});
  Object.keys(state).forEach(function(id){var l=state[id],r=remote[id];if(!r||String(l.at||'')>String(r.at||''))if(!p.progress[id])p.progress[id]=l;});
  keep(p);
  if(changed){save();if(!answered&&!shown)queue=null;render();}}
var CL=window.claude;
if(CL&&typeof CL.use==='function'){CL.use('db').then(function(d){db=d||null;ready=true;if(db)flush();else showSync();},function(){ready=true;showSync();});}
else{ready=true;showSync();}
render();
})();
</script>
