</style></head><body><div id="read-progress" aria-hidden="true"></div>{{SKIP}}<div class="layout"><aside class="sidebar">{{BRAND}}<div class="nav-label">阅读顺序</div>{{TOC}}<div class="study-tools"><div class="nav-label">阅读模式</div><div class="mode-switch" role="group" aria-label="阅读模式"><button type="button" data-mode="bi" aria-pressed="true">双语</button><button type="button" data-mode="en" aria-pressed="false">English</button><button type="button" data-mode="recall" aria-pressed="false">自测</button></div><p class="mode-hint" data-for="bi">英文在前，中文在后。</p><p class="mode-hint" data-for="en" hidden>只显示英文。点一下段落即可看中文。</p><p class="mode-hint" data-for="recall" hidden>图中标注和关键事实被遮住，点一下即可显示答案。</p><p class="done-line">已完成 <b id="done-count">0</b> / {{NCH}} 章</p></div><p class="sidebar-note">{{SIDEBAR_NOTE}}</p></aside><main class="main">{{HEADER}}{{CHAPTERS}}<footer class="page-footer">{{FOOTER}}</footer></main></div><script>const chapters=[...document.querySelectorAll('.chapter')];const links=[...document.querySelectorAll('.toc a')];let queued=false;function update(){const offset=innerWidth<=820?110:130;let current=chapters[0];for(const chapter of chapters){if(chapter.getBoundingClientRect().top<=offset)current=chapter;}for(const link of links){if(link.hash==='#'+current.id)link.setAttribute('aria-current','location');else link.removeAttribute('aria-current');}queued=false;}addEventListener('scroll',()=>{if(!queued){queued=true;requestAnimationFrame(update);}}, {passive:true});addEventListener('resize',update);update();const closed=[];addEventListener('beforeprint',()=>{for(const el of document.querySelectorAll('details:not([open])')){closed.push(el);el.open=true;}});addEventListener('afterprint',()=>{for(const el of closed)el.open=false;closed.length=0;});</script><script>(function(){
var KEY='{{KEY}}';
function get(k,d){try{var v=localStorage.getItem(KEY+k);return v===null?d:JSON.parse(v);}catch(e){return d;}}
function set(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v));}catch(e){}}
var body=document.body;
/* reading modes */
function setMode(m){body.classList.remove('mode-bi','mode-en','mode-recall');body.classList.add('mode-'+m);
 document.querySelectorAll('.mode-switch button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.mode===m?'true':'false');});
 document.querySelectorAll('.mode-hint').forEach(function(h){h.hidden=h.dataset.for!==m;});
 document.querySelectorAll('.reveal').forEach(function(e){e.classList.remove('reveal');});set('mode',m);}
document.querySelectorAll('.mode-switch button').forEach(function(b){b.addEventListener('click',function(){setMode(b.dataset.mode);});});
setMode(get('mode','bi'));
var REV='.bilingual-pair,th,td,dd,h2,h3,h4,li,figcaption,.question-pair,.mnemonic-original,.takeaway,.term,.attachment-diagram,figure.diagram,.paper-meta,.primary-result';
document.addEventListener('click',function(e){
 if(!(body.classList.contains('mode-en')||body.classList.contains('mode-recall')))return;
 if(e.target.closest('button,.toc,.study-tools,.fc-card'))return;
 var t=e.target.closest(REV);if(!t||!t.closest('.chapter'))return;
 var link=e.target.closest('a');
 if(link&&!t.classList.contains('reveal')&&body.classList.contains('mode-recall')&&t.matches('.attachment-diagram,figure.diagram')){e.preventDefault();}
 if(link&&t.classList.contains('reveal'))return;
 t.classList.toggle('reveal');});
/* pronunciation */
try{if(window.speechSynthesis){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=function(){speechSynthesis.getVoices();};}}catch(e){}function pickVoice(lang){var vs=speechSynthesis.getVoices().filter(function(v){return v.lang&&v.lang.replace('_','-').toLowerCase().indexOf(lang.toLowerCase().slice(0,2))===0;});if(!vs.length)return null;var good=lang.indexOf('zh')===0?/(Premium|Enhanced|Tingting|Ting-Ting|Lili|Yu-shu|Xiaoxiao|Yunxi|Google 普通话|Google\u00a0普通话)/i:/(Premium|Enhanced|Siri|Samantha|Ava|Allison|Susan|Zoe|Google US English|Aria|Jenny|Guy)/i;vs.sort(function(a,b){function sc(v){return (good.test(v.name)?4:0)+(v.lang.replace('_','-')===lang?2:0)+(v.localService?1:0);}return sc(b)-sc(a);});return vs[0];}function say(text,lang){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang||'en-US';u.rate=u.lang.indexOf('zh')===0?0.8:0.82;var v=pickVoice(u.lang);if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}}
document.addEventListener('click',function(e){var b=e.target.closest('.say');if(b){e.preventDefault();say(b.dataset.say,b.dataset.lang);}});
/* reading time per chapter */
document.querySelectorAll('.chapter').forEach(function(ch){var w=0;ch.querySelectorAll('[lang=en]').forEach(function(n){if(!n.closest('svg'))w+=n.textContent.trim().split(/\s+/).length;});
 var figs=ch.querySelectorAll('svg[data-figure]').length;var min=Math.max(3,Math.round(w/130+figs*0.7));
 var rt=ch.querySelector('.read-time');if(rt)rt.textContent='约 '+min+' 分钟';
 var a=document.querySelector('.toc a[href="#'+ch.id+'"] small');if(a&&!a.dataset.t){a.dataset.t=1;a.textContent+=' · '+min+' 分钟';}});
/* chapter done */
var done=get('done',{});
function paintDone(){var n=0;document.querySelectorAll('.mark-done').forEach(function(b){var d=!!done[b.dataset.chapter];b.classList.toggle('is-done',d);b.innerHTML=d?'<span lang="en">Done</span> · <span lang="zh-Hans">已完成 ✓（再点一次取消）</span>':'<span lang="en">Mark this chapter as done</span> · <span lang="zh-Hans">标记本章已完成</span>';});
 document.querySelectorAll('.toc a').forEach(function(a){var id=a.hash.slice(1);a.classList.toggle('is-done',!!done[id]);if(done[id])n++;});
 var c=document.getElementById('done-count');if(c)c.textContent=n;}
document.querySelectorAll('.mark-done').forEach(function(b){b.addEventListener('click',function(){done[b.dataset.chapter]=!done[b.dataset.chapter];set('done',done);paintDone();});});
paintDone();
/* progress bar */
var bar=document.getElementById('read-progress');
function prog(){var h=document.documentElement;var p=h.scrollTop/(h.scrollHeight-h.clientHeight||1);bar.style.width=(Math.min(1,Math.max(0,p))*100)+'%';}
addEventListener('scroll',prog,{passive:true});prog();
/* print */
document.querySelectorAll('.print-btn').forEach(function(b){b.addEventListener('click',function(){window.print();});});
/* flashcards */
var fc=document.getElementById('flashcards');
if(fc){var deck=JSON.parse(document.getElementById('deck-data').textContent);var known=get('known',{});var queue=[],cur=null;
 var front=fc.querySelector('.fc-front'),back=fc.querySelector('.fc-back'),flip=fc.querySelector('.fc-flip'),again=fc.querySelector('.fc-again'),know=fc.querySelector('.fc-know'),cnt=fc.querySelector('.fc-count');
 function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
 function refill(){queue=deck.map(function(c,i){return i;}).filter(function(i){return !known[i];});}
 function show(){var k=Object.keys(known).length;cnt.textContent='记住了 '+k+' / '+deck.length+' 张';
  if(!queue.length)refill();
  if(!queue.length){front.innerHTML='<p lang="en">All cards known. Reset to start again.</p><p class="translation" lang="zh-Hans">全部记住了。点“重置”可以重新开始。</p>';back.hidden=true;flip.hidden=again.hidden=know.hidden=true;cur=null;return;}
  cur=queue.shift();var c=deck[cur];front.innerHTML='<p lang="en">'+esc(c.f[0])+'</p><p class="translation" lang="zh-Hans">'+esc(c.f[1])+'</p>';
  back.innerHTML='<p lang="en">'+esc(c.b[0])+'</p><p class="translation" lang="zh-Hans">'+esc(c.b[1])+'</p>';back.hidden=true;flip.hidden=false;again.hidden=know.hidden=true;}
 function turn(){if(cur===null)return;back.hidden=false;flip.hidden=true;again.hidden=know.hidden=false;}
 flip.addEventListener('click',turn);fc.querySelector('.fc-card').addEventListener('click',turn);
 fc.querySelector('.fc-card').addEventListener('keydown',function(e){if(e.key===' '||e.key==='Enter'){e.preventDefault();turn();}});
 again.addEventListener('click',function(){queue.push(cur);show();});
 know.addEventListener('click',function(){known[cur]=1;set('known',known);show();});
 fc.querySelector('.fc-reset').addEventListener('click',function(){known={};set('known',known);refill();show();});
 fc.querySelector('.fc-say').addEventListener('click',function(){if(cur!==null)say(deck[cur].say,deck[cur].lang);});
 refill();show();}
/* spelling (F-9) and typed notes (F-11) */
document.querySelectorAll('.spell-check').forEach(function(b){b.addEventListener('click',function(){var it=b.closest('.spell-item'),inp=it.querySelector('input'),out=it.querySelector('.spell-result');
 var ok=inp.value.trim().toLowerCase().replace(/\s+/g,' ')===inp.dataset.answer.toLowerCase();out.textContent=ok?'✓':'✗ '+inp.dataset.answer;out.className='spell-result '+(ok?'is-ok':'is-wrong');});});
var notes=get('notes',{});
document.querySelectorAll('.typed-notes').forEach(function(t){t.value=notes[t.dataset.key]||'';t.addEventListener('input',function(){notes[t.dataset.key]=t.value;set('notes',notes);});});
})();</script></body></html>
