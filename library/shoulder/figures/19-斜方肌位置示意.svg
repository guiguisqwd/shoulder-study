none" clip-path="url(#fig19-c-middle)" /><path d="M36,140 L136,139" stroke="#2B6C7C" stroke-width="0.8" opacity="0.5" fill="none" clip-path="url(#fig19-c-middle)" /><path d="M36,154 L120,144" stroke="#2B6C7C" stroke-width="0.8" opacity="0.5" fill="none" clip-path="url(#fig19-c-middle)" /><path d="M36,190 L104,150" stroke="#2B6C7C" stroke-width="0.8" opacity="0.5" fill="none" clip-path="url(#fig19-c-lower)" /><path d="M36,220 L96,152" stroke="#2B6C7C" stroke-width="0.8" opacity="0.5" fill="none" clip-path="url(#fig19-c-lower)" /><path d="M36,250 L90,154" stroke="#2B6C7C" stroke-width="0.8" opacity="0.5" fill="none" clip-path="url(#fig19-c-lower)" /><path d="M36,280 L85,156" stroke="#2B6C7C" stroke-width="0.8" opacity="0.5" fill="none" clip-path="url(#fig19-c-lower)" /><path d="M36,306 L82,157" stroke="#2B6C7C" stroke-width="0.8" opacity="0.5" fill="none" clip-path="url(#fig19-c-lower)" /><path d="M58,18 Q66,80 132,112 M80,158 Q60,240 36,316" stroke="#2B6C7C" stroke-width="2" fill="none" /><path d="M29,11 L59,15 L59,22 L43,20 L43,322 L29,322 Z" fill="#4a8475" fill-opacity=".14" stroke="#245e50" stroke-width="1.4" stroke-dasharray="4 3" /><path d="M131,109 Q155,114 180,120 L176,129 L151,140 L82,162 L78,155 L148,131 L169,124 Q152,119 131,116 Z" fill="#d69745" fill-opacity=".32" stroke="#996524" stroke-width="1.3" /><path d="M40,80 L148,116" stroke="#324c44" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#fig19-attachment-arrow)" /><path d="M44,128 L146,132" stroke="#324c44" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#fig19-attachment-arrow)" /><path d="M40,270 L80,169" stroke="#324c44" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#fig19-attachment-arrow)" /><circle cx="36" cy="244" r="9" fill="#fffaf0" stroke="#376e64" stroke-width="1.6" /><text x="36" y="248" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, sans-serif" fill="#376e64">O</text><circle cx="124" cy="143" r="9" fill="#fffaf0" stroke="#996524" stroke-width="1.6" /><text x="124" y="147" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, sans-serif" fill="#996524">I</text><text x="24" y="104" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#6b726b" text-anchor="end" aria-label="C7">C7</text><text x="24" y="176" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#6b726b" text-anchor="end" aria-label="T4">T4</text><text x="24" y="320" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#6b726b" text-anchor="end" aria-label="T12">T12</text><path d="M138,24 L118,26" stroke="#8a8f88" stroke-width="0.9" fill="none" /><text x="140" y="20" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#4f5650" font-weight="normal" text-anchor="start" aria-label="Occipital bone — 枕骨"><tspan x="140" dy="0" lang="en">Occipital bone</tspan><tspan x="140" dy="12" font-size="10" font-weight="normal" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" lang="zh-CN">枕骨</tspan></text><path d="M198,98 L166,118" stroke="#8a8f88" stroke-width="0.9" fill="none" /><text x="200" y="92" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#4f5650" font-weight="normal" text-anchor="start" aria-label="Clavicle — 锁骨"><tspan x="200" dy="0" lang="en">Clavicle</tspan><tspan x="200" dy="12" font-size="10" font-weight="normal" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" lang="zh-CN">锁骨</tspan></text><path d="M210,166 L186,136" stroke="#8a8f88" stroke-width="0.9" fill="none" /><text x="200" y="176" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#4f5650" font-weight="normal" text-anchor="start" aria-label="Acromion — 肩峰"><tspan x="200" dy="0" lang="en">Acromion</tspan><tspan x="200" dy="12" font-size="10" font-weight="normal" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" lang="zh-CN">肩峰</tspan></text><path d="M176,206 L140,140" stroke="#8a8f88" stroke-width="0.9" fill="none" /><text x="176" y="214" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#4f5650" font-weight="normal" text-anchor="start" aria-label="Spine of scapula — 肩胛冈"><tspan x="176" dy="0" lang="en">Spine of scapula</tspan><tspan x="176" dy="12" font-size="10" font-weight="normal" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" lang="zh-CN">肩胛冈</tspan></text><text x="176" y="286" font-size="12" font-family="Arial, Helvetica, sans-serif" fill="#6b726b" font-weight="normal" text-anchor="start" aria-label="Posterior view — 后面观"><tspan x="176" dy="0" lang="en">Posterior view</tspan><tspan x="176" dy="15" font-size="11" font-weight="normal" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" lang="zh-CN">后面观</tspan></text><path d="M12,332 L263,332" stroke="#d0d9cf" stroke-width="1" /><rect x="12" y="336" width="12" height="12" fill="#7FB3BE" stroke="#2B6C7C" stroke-width="1.2" /><text x="30" y="346" font-size="12" font-family="Arial, Helvetica, sans-serif" fill="#263c37" font-weight="normal" text-anchor="start" aria-label="Upper trapezius (descending part) → lateral third of clavicle — 上斜方肌（降部）→ 锁骨外侧三分之一"><tspan x="30" dy="0" lang="en">Upper trapezius (descending part)</tspan><tspan x="30" dy="15" lang="en">→ lateral third of clavicle</tspan><tspan x="30" dy="15" font-size="11" font-weight="normal" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" lang="zh-CN">上斜方肌（降部）→ 锁骨外侧三分之一</tspan></text><rect x="12" y="388" width="12" height="12" fill="#A9CDD4" stroke="#2B6C7C" stroke-width="1.2" /><text x="30" y="398" font-size="12" font-family="Arial, Helvetica, sans-serif" fill="#263c37" font-weight="normal" text-anchor="start" aria-label="Middle trapezius (transverse part) → acromion and lateral spine — 中斜方肌（横部）→ 肩峰与肩胛冈外侧"><tspan x="30" dy="0" lang="en">Middle trapezius (transverse part)</tspan><tspan x="30" dy="15" lang="en">→ acromion and lateral spine</tspan><tspan x="30" dy="15" font-size="11" font-weight="normal" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" lang="zh-CN">中斜方肌（横部）→ 肩峰与肩胛冈外侧</tspan></text><rect x="12" y="440" width="12" height="12" fill="#D3E7EA" stroke="#2B6C7C" stroke-width="1.2" /><text x="30" y="450" font-size="12" font-family="Arial, Helvetica, sans-serif" fill="#263c37" font-weight="normal" text-anchor="start" aria-label="Lower trapezius (ascending part) → medial end of scapular spine — 下斜方肌（升部）→ 肩胛冈内侧端"><tspan x="30" dy="0" lang="en">Lower trapezius (ascending part)</tspan><tspan x="30" dy="15" lang="en">→ medial end of scapular spine</tspan><tspan x="30" dy="15" font-size="11" font-weight="normal" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" lang="zh-CN">下斜方肌（升部）→ 肩胛冈内侧端</tspan></text><path d="M12,490 L263,490" stroke="#d0d9cf" stroke-width="1" /><text x="12" y="510" font-size="14" font-family="Arial, Helvetica, sans-serif" fill="#263c37" font-weight="bold" text-anchor="start" aria-label="O  Origin — 起点"><tspan x="12" dy="0" lang="en">O  Origin</tspan><tspan x="12" dy="17" font-size="13" font-weight="normal" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" lang="zh-CN">起点</tspan></text><text x="12" y="548" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#263c37" font-weight="normal" text-anchor="start" aria-label="Occipital bone, nuchal ligament, spinous processes of C7–T12 — 枕骨、项韧带、C7–T12 棘突"><tspan x="12" dy="0" lang="en">Occipital bone, nuchal ligament,</tspan><tspan x="12" dy="16" lang="en">spinous processes of C7–T12</tspan><tspan x="12" dy="16" font-size="12" font-weight="normal" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" lang="zh-CN">枕骨、项韧带、C7–T12 棘突</tspan></text><text x="12" y="612" font-size="14" font-family="Arial, Helvetica, sans-serif" fill="#865b26" font-weight="bold" text-anchor="start" aria-label="I  Insertion — 止点"><tspan x="12" dy="0" lang="en">I  Insertion</tspan><tspan x="12" dy="17" font-size="13" font-weight="normal" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" lang="zh-CN">止点</tspan></text><text x="12" y="650" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#865b26" font-weight="normal" text-anchor="start" aria-label="Lateral third of clavicle, acromion, spine of scapula — 锁骨外侧三分之一、肩峰、肩胛冈"><tspan x="12" dy="0" lang="en">Lateral third of clavicle, acromion,</tspan><tspan x="12" dy="16" lang="en">spine of scapula</tspan><tspan x="12" dy="16" font-size="12" font-weight="normal" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" lang="zh-CN">锁骨外侧三分之一、肩峰、肩胛冈</tspan></text><text x="12" y="714" font-size="11" font-family="Arial, Helvetica, sans-serif" fill="#6b726b" font-weight="normal" text-anchor="start" aria-label="C7, T4 and T12 mark vertebrae (bone), not spinal nerve levels. — C7、T4、T12 指椎骨，不是脊神经节段。"><tspan x="12" dy="0" lang="en">C7, T4 and T12 mark vertebrae (bone),</tspan><tspan x="12" dy="14" lang="en">not spinal nerve levels.</tspan><tspan x="12" dy="14" font-size="10" font-weight="normal" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" lang="zh-CN">C7、T4、T12 指椎骨，不是脊神经节段。</tspan></text><text x="12" y="768" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#7b817b" font-weight="normal" text-anchor="start" aria-label="Schematic; pathway and layers are simplified. — 解剖示意；走行与层次经过简化。"><tspan x="12" dy="0" lang="en">Schematic; pathway and layers are simplified.</tspan><tspan x="12" dy="13" font-size="9" font-weight="normal" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" lang="zh-CN">解剖示意；走行与层次经过简化。</tspan></text><desc>Right trapezius, posterior view. Shaded bands: upper (descending), middle (transverse) and lower (ascending) parts; the vertebral levels at which the parts divide differ between sources. Dashed green strip: origin along the occipital bone, nuchal ligament and C7–T12 spinous processes. Gold strip: insertion along the lateral third of the clavicle, the acromion and the spine of the scapula. Dashed arrows: origin-to-insertion attachment maps, not force vectors. 右侧斜方肌后面观。三种色带为上部（降部）、中部（横部）、下部（升部）；各部分界的椎骨节段在不同资料中略有出入。虚线绿色条：沿枕骨、项韧带和 C7–T12 棘突的起点；金色条：锁骨外侧三分之一、肩峰和肩胛冈的止点。虚线箭头表示起点到止点的附着关系，并非力矢量。</desc></svg>
