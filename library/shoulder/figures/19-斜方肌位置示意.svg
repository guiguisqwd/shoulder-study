<svg xmlns="http://www.w3.org/2000/svg" width="275" height="792" viewBox="0 0 275 792" role="img" aria-label="Trapezius: origin and insertion — 斜方肌起点与止点"><style type="text/css">.cn{font-family:"Kaiti SC","STKaiti","KaiTi",serif}.en{font-family:"Chalkboard SE","Kaiti SC",sans-serif}.title{font-family:"Marker Felt","Kaiti SC",sans-serif}</style><defs><marker id="fig19-attachment-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#324c44" stroke-width="1.5" /></marker><clipPath id="fig19-c-upper"><path d="M36,14 L58,18 Q66,80 132,112 Q154,118 176,124 L170,128 Q100,108 36,100 Z" /></clipPath><clipPath id="fig19-c-middle"><path d="M36,100 Q100,108 170,128 L150,136 L108,148 Q70,160 36,172 Z" /></clipPath><clipPath id="fig19-c-lower"><path d="M36,172 Q70,160 108,148 L80,158 Q60,240 36,316 Z" /></clipPath></defs><path d="M36,0 L120,0 Q126,24 112,42 Q86,20 36,14 Z" fill="#FBF5E6" stroke="#3A3A3A" stroke-width="1.8" /><path d="M36,14 L36,324" stroke="#b9b4a6" stroke-width="1.2" /><ellipse cx="36" cy="100" rx="5" ry="4.5" fill="#FBF5E6" stroke="#3A3A3A" stroke-width="1.3" /><ellipse cx="36" cy="118" rx="5" ry="4.5" fill="#FBF5E6" stroke="#3A3A3A" stroke-width="1.3" /><ellipse cx="36" cy="136" rx="5" ry="4.5" fill="#FBF5E6" stroke="#3A3A3A" stroke-width="1.3" /><ellipse cx="36" cy="154" rx="5" ry="4.5" fill="#FBF5E6" stroke="#3A3A3A" stroke-width="1.3" /><ellipse cx="36" cy="172" rx="5" ry="4.5" fill="#FBF5E6" stroke="#3A3A3A" stroke-width="1.3" /><ellipse cx="36" cy="190" rx="5" ry="4.5" fill="#FBF5E6" stroke="#3A3A3A" stroke-width="1.3" /><ellipse cx="36" cy="208" rx="5" ry="4.5" fill="#FBF5E6" stroke="#3A3A3A" stroke-width="1.3" /><ellipse cx="36" cy="226" rx="5" ry="4.5" fill="#FBF5E6" stroke="#3A3A3A" stroke-width="1.3" /><ellipse cx="36" cy="244" rx="5" ry="4.5" fill="#FBF5E6" stroke="#3A3A3A" stroke-width="1.3" /><ellipse cx="36" cy="262" rx="5" ry="4.5" fill="#FBF5E6" stroke="#3A3A3A