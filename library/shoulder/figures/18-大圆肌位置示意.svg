<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="275" height="560" viewBox="0 0 275 560" role="img" aria-label="Teres major: origin and insertion — 大圆肌起点与止点"><style type="text/css">.cn{font-family:"Kaiti SC","STKaiti","KaiTi",serif}.en{font-family:"Chalkboard SE","Kaiti SC",sans-serif}.title{font-family:"Marker Felt","Kaiti SC",sans-serif}</style><defs><marker id="fig18-attachment-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#324c44" stroke-width="1.5" /></marker><clipPath id="fig18-c-teres-major"><path d="M168,592 Q148,556 152,512 Q236,446 330,384 Q404,334 478,300 L480,338 Q404,372 334,432 Q262,500 222,564 Q200,594 168,592 Z" /></clipPath></defs><g transform="translate(40,40) scale(0.33)"><path d="M85,72 L292,63 Q300,74 308,64 L322,70 Q352,82 372,98 L384,140 L386,200 Q345,280 300,352 L172,598 Q140,540 118,480 L62,340 Q66,250 76,160 Z" fill="#FBF5E6" stroke="#3A3A3A" stroke-width="7.3" /><path d="M168,592 Q148,556 152,512 Q236,446 330,384 Q404,334 478,300 L480,338 Q404,372 334,432 Q262,500 222,564 Q200,594 168,592 Z" fill="#E6D6CF" stroke="#826459" stroke-width="7.3" /><path d="M160,540 Q320,420 480,312" stroke="#826459" stroke-width="3.5" fill="none" opacity="0.55" clip-path="url(#fig18-c-teres-major)" /><path d="M175,575 Q330,440 480,326" stroke="#826459" stroke-width="3.5" fill="none" opacity="0.55" clip-path="url(#fig18-c-teres-major)" /><path d="M205,560 Q345,450 480,334" stroke="#826459" stroke-width="3.5" fill="none" opacity="0.55" clip-path="url(#fig18-c-teres-major)" /><path d="M478,200 Q470,400 484,600 L526,600 Q520,400 532,205 Z" fill="#FBF5E6" stroke="#3A3A3A" stroke-width="7.3" /><circle cx="470" cy="150" r="62" fill="#FBF5E6" stroke="#3A3A3A" stroke-width="7.3" /><path d="M88,160 L252,118 L396,78 L408,96 L258,140 L92,180 Z" fill="#FBF5E6" stroke="#3A3A3A" stroke-width="7.3" /><path d="M392,72 Q470,42 542,56 Q556,72 542,86 Q470,96 406,100 Z" fill="#FBF5E6" stroke="#3A3A3A" stroke-width="7.3" /><path d="M170,592 Q148,556 146,516 Q176,496 214,492 L222,496 Q212,530 200,548 Z" fill="#4a8475" fill-opacity=".12" stroke="#245e50" stroke-width="4.5" stroke-dasharray="10 6" /><path d="M478,268 L498,266 L500,372 L482,374 Z" fill="#d69745" fill-opacity=".18" stroke="#996524" stroke-width="4.5" stroke-dasharray="9 6" /></g><path d="M106.2,219.4 L195.5,152.5" stroke="#324c44" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#fig18-attachment-arrow)" /><circle cx="98" cy="225" r="9" fill="#fffaf0" stroke="#376e64" stroke-width="1.6" /><text x="98" y="229" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, sans-serif" fill="#376e64">O</text><circle cx="214" cy="146" r="9" fill="#fffaf0" stroke="#996524" stroke-width="1.6" stroke-dasharray="3 2" /><text x="214" y="150" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, sans-serif" fill="#996524">I</text><text x="12" y="18" font-size="12" font-family="Arial, Helvetica, sans-serif" fill="#6b726b" font-weight="normal" text-anchor="start" aria-label="Posterior view — 后面观"><tspan x="12" dy="0" lang="en">Posterior view</tspan><tspan x="12" dy="15" font-size="11" font-weight="normal" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" lang="zh-CN">后面观</tspan></text><path d="M12,266 L263,266" stroke="#d0d9cf" stroke-width="1" /><text x="12" y="287" font-size="14" font-family="Arial, Helvetica, sans-serif" fill="#263c37" font-weight="bold" text-anchor="start" aria-label="O  Origin — 起点"><tspan x="12" dy="0" lang="en">O  Origin</tspan><tspan x="12" dy="17" font-size="13" font-weight="normal" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" lang="zh-CN">起点</tspan></text><text x="12" y="325" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#263c37" font-weight="normal" text-anchor="start" aria-label="Posterior surface of the inferior angle of scapula — 肩胛骨下角后面"><tspan x="12" dy="0" lang="en">Posterior surface of the</tspan><tspan x="12" dy="16" lang="en">inferior angle of scapula</tspan><tspan x="12" dy="16" font-size="12" font-weight="normal" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" lang="zh-CN">肩胛骨下角后面</tspan></text><text x="12" y="390" font-size="14" font-family="Arial, Helvetica, sans-serif" fill="#865b26" font-weight="bold" text-anchor="start" aria-label="I  Insertion — 止点"><tspan x="12" dy="0" lang="en">I  Insertion</tspan><tspan x="12" dy="17" font-size="13" font-weight="normal" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" lang="zh-CN">止点</tspan></text><text x="12" y="428" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#865b26" font-weight="normal" text-anchor="start" aria-label="Medial lip of the intertubercular groove of humerus — 肱骨结节间沟内侧唇"><tspan x="12" dy="0" lang="en">Medial lip of the</tspan><tspan x="12" dy="16" lang="en">intertubercular groove of humerus</tspan><tspan x="12" dy="16" font-size="12" font-weight="normal" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" lang="zh-CN">肱骨结节间沟内侧唇</tspan></text><text x="12" y="482" font-size="11" font-family="Arial, Helvetica, sans-serif" fill="#6b726b" font-weight="normal" text-anchor="start" aria-label="Dashed I: on the anterior surface, hidden in this view — 虚线 I：位于肱骨前面，此视角看不到"><tspan x="12" dy="0" lang="en">Dashed I: on the anterior surface,</tspan><tspan x="12" dy="14" lang="en">hidden in this view</tspan><tspan x="12" dy="14" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" lang="zh-CN">虚线 I：位于肱骨前面，此视角看不到</tspan></text><text x="12" y="532" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#7b817b" font-weight="normal" text-anchor="start" aria-label="Schematic; pathway and layers are simplified. — 解剖示意；走行与层次经过简化。"><tspan x="12" dy="0" lang="en">Schematic; pathway and layers are simplified.</tspan><tspan x="12" dy="13" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" lang="zh-CN">解剖示意；走行与层次经过简化。</tspan></text><desc>Dashed green area: representative origin region on the posterior surface of the inferior angle. Dashed gold area: insertion on the anterior surface of the humerus, behind the shaft in this posterior view. Dashed arrow: origin-to-insertion attachment map, not a force vector. 虚线绿色区域为下角后面的起点示意；虚线金色区域为肱骨前面的止点，在后面观中被骨干遮挡；虚线箭头表示起点到止点的附着关系，并非力矢量。</desc></svg>
